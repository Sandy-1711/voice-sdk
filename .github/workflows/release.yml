name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs history to work out what has already shipped.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Opens or updates a release pull request while changesets are pending.
      # Merging that pull request is what publishes: this step then finds no
      # pending changesets, runs `pnpm release`, and pushes the tarballs.
      # v2 is the release line that pairs with @changesets/cli v3. v1 worked out
      # what had shipped by scraping "New tag:" lines out of the publish output,
      # which v3 no longer prints — so it saw nothing published and quietly
      # skipped both the tag push and the GitHub release.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # The registry credential comes from the .npmrc setup-node wrote;
          # v2 no longer handles the token itself.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
